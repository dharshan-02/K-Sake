name: keepsake
description: Offline-first encrypted personal file vault.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^7.0.0
  cryptography: ^2.7.0
  file_picker: ^13.3.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.5
  pdfrx: ^2.11.0
  sqlite3: ^3.8.0
  uuid: ^4.5.1
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
