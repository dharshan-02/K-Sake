services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keepsake
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: keepsake
    ports:
      - "5432:5432"
    volumes:
      - keepsake_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keepsake -d keepsake"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-minio-access
      MINIO_ROOT_PASSWORD: local-minio-secret-change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - keepsake_s3:/data
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c", "until mc alias set local http://minio:9000 local-minio-access local-minio-secret-change-me; do sleep 2; done; mc mb --ignore-existing local/keepsake-encrypted; mc anonymous set none local/keepsake-encrypted"]
  api:
    build:
      context: ./server
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgresql://keepsake:local-dev-only@postgres:5432/keepsake?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: local-minio-access
      S3_SECRET_ACCESS_KEY: local-minio-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
volumes:
  keepsake_pg:
  keepsake_s3:
